name: GoLocal Android Release APK & Update Manifest

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release versionName (e.g. 1.1.0). Leave blank to auto-generate."
        required: false
        default: ""
      release_notes:
        description: "User-facing release notes shown inside the in-app updater"
        required: false
        default: "Stability, security, and local ride performance improvements."
      is_mandatory:
        description: "Mark this update as mandatory (blocks older builds)"
        type: boolean
        required: false
        default: false
      min_supported_version_code:
        description: "Minimum supported versionCode (default 1)"
        required: false
        default: "1"

permissions:
  contents: write
  actions: read

jobs:
  build_and_release:
    name: Build, Sign, Verify & Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      apk_sha256: ${{ steps.checksum.outputs.sha256 }}
      release_tag: ${{ steps.meta.outputs.release_tag }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Production Signing Secrets
        id: validate_secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            if [ "$EVENT_NAME" = "push" ] && [[ "${{ github.ref }}" != refs/tags/* ]]; then
              echo "::notice::Production release signing secrets (ANDROID_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are not configured yet. Skipping signed release build on push to main; Debug APK builds via GoLocal Android Debug APK workflow."
              echo "has_secrets=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Missing production signing credentials in GitHub Secrets!"
            echo "Required secrets: ANDROID_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD (and optional KEY_ALIAS if not 'upload')."
            echo "Per GoLocal security policy, random ephemeral signing keys are never generated. Please upload your original production upload keystore and retry."
            exit 1
          fi
          echo "has_secrets=true" >> "$GITHUB_OUTPUT"

      - name: Compute Version Metadata & Manifest URL
        id: meta
        shell: bash
        run: |
          RUN_NUM="${{ github.run_number }}"
          VERSION_CODE=$((RUN_NUM + 1))
          INPUT_VER="${{ inputs.version_name }}"
          if [ -n "$INPUT_VER" ]; then
            VERSION_NAME="$INPUT_VER"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="1.0.${VERSION_CODE}"
          fi
          RELEASE_TAG="v${VERSION_NAME}-b${VERSION_CODE}"
          APK_FILENAME="GoLocal-v${VERSION_NAME}-${VERSION_CODE}.apk"
          REPO="${{ github.repository }}"
          MANIFEST_URL="https://github.com/${REPO}/releases/latest/download/update-manifest.json"
          APK_DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${APK_FILENAME}"

          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_filename=${APK_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "manifest_url=${MANIFEST_URL}" >> "$GITHUB_OUTPUT"
          echo "apk_download_url=${APK_DOWNLOAD_URL}" >> "$GITHUB_OUTPUT"

      - name: Restore Production Keystore & Optional Config Files
        if: steps.validate_secrets.outputs.has_secrets == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          RAW_KEYSTORE="${{ runner.temp }}/raw-upload-key.jks"
          FINAL_KEYSTORE="${{ runner.temp }}/golocal-upload-key.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RAW_KEYSTORE"

          # Preserve app/build.gradle.kts keyAlias="upload" while supporting custom KEY_ALIAS secret
          if [ -n "$KEY_ALIAS" ] && [ "$KEY_ALIAS" != "upload" ]; then
            cp "$RAW_KEYSTORE" "$FINAL_KEYSTORE"
            keytool -changealias \
              -alias "$KEY_ALIAS" \
              -destalias "upload" \
              -keystore "$FINAL_KEYSTORE" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD"
          else
            mv "$RAW_KEYSTORE" "$FINAL_KEYSTORE"
          fi
          echo "KEYSTORE_PATH=${FINAL_KEYSTORE}" >> "$GITHUB_ENV"

          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ] && [ ! -f "app/google-services.json" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi

      - name: Set up Android SDK Base
        if: steps.validate_secrets.outputs.has_secrets == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Required Android SDK Packages
        if: steps.validate_secrets.outputs.has_secrets == 'true'
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable not found."
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "build-tools;36.0.0"
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "platforms;android-36.1" || true

      - name: Set up Gradle (9.3.1 for AGP 9.1.1)
        if: steps.validate_secrets.outputs.has_secrets == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run Unit Tests & Build Signed Release APK
        if: steps.validate_secrets.outputs.has_secrets == 'true'
        shell: bash
        env:
          APP_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          UPDATE_MANIFEST_URL: ${{ steps.meta.outputs.manifest_url }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p build-logs
          set -o pipefail
          COMMON_HTTP_FLAGS=(
            -Dorg.gradle.internal.http.connectionTimeout=60000
            -Dorg.gradle.internal.http.socketTimeout=60000
          )

          MAX_ATTEMPTS=3
          ATTEMPT=1
          BUILD_OK=false
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            EXTRA_FLAGS=()
            if [ "$ATTEMPT" -gt 1 ]; then
              EXTRA_FLAGS+=(--refresh-dependencies)
              echo "::warning::Release Gradle attempt $((ATTEMPT - 1)) failed; retrying with --refresh-dependencies (attempt ${ATTEMPT}/${MAX_ATTEMPTS})..."
              sleep $(( (ATTEMPT - 1) * 10 ))
            else
              echo "Running Release Gradle build (attempt ${ATTEMPT}/${MAX_ATTEMPTS})..."
            fi

            if gradle :app:testDebugUnitTest \
              --tests "com.example.ExampleUnitTest" \
              --tests "com.example.ExampleRobolectricTest" \
              --tests "com.example.ui.auth.AuthFlowUnitTest" \
              :app:assembleRelease "${EXTRA_FLAGS[@]}" "${COMMON_HTTP_FLAGS[@]}" --no-daemon --stacktrace 2>&1 | tee build-logs/gradle-build.log; then
              BUILD_OK=true
              break
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$BUILD_OK" != "true" ]; then
            echo "::error::Release Gradle build failed after ${MAX_ATTEMPTS} attempts."
            exit 1
          fi

      - name: Verify Package Identity, Signing Key & Generate SHA-256 Manifest
        id: checksum
        if: steps.validate_secrets.outputs.has_secrets == 'true'
        shell: bash
        run: |
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "::error::Signed release APK not found at $APK_SOURCE"
            exit 1
          fi

          mkdir -p dist
          APK_OUT="dist/${{ steps.meta.outputs.apk_filename }}"
          cp "$APK_SOURCE" "$APK_OUT"

          # Locate Android build-tools apksigner and verify signature + applicationId
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_OUT" | tee build-logs/apksigner-verify.log
          fi

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" | sort -V | tail -n 1)
          if [ -n "$AAPT2" ]; then
            PKG_LINE=$("$AAPT2" dump badging "$APK_OUT" | grep "^package:")
            echo "$PKG_LINE" | tee build-logs/apk-package-info.log
            if [[ "$PKG_LINE" != *"name='com.aistudio.golocal.wbmxrq'"* ]]; then
              echo "::error::Package identity mismatch! Expected com.aistudio.golocal.wbmxrq"
              exit 1
            fi
          fi

          SHA256=$(sha256sum "$APK_OUT" | awk '{print $1}')
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum "${{ steps.meta.outputs.apk_filename }}" > "SHA256SUMS.txt")
          echo "${SHA256}  ${{ steps.meta.outputs.apk_filename }}" > "dist/${{ steps.meta.outputs.apk_filename }}.sha256"

          M_SHA256="$SHA256" python3 - <<'PY' > dist/update-manifest.json
          import json, os
          notes = os.environ.get("M_NOTES", "").strip() or f"GoLocal v{os.environ['M_VER_NAME']} production release."
          manifest = {
              "versionName": os.environ["M_VER_NAME"],
              "versionCode": int(os.environ["M_VER_CODE"]),
              "apkDownloadUrl": os.environ["M_APK_URL"],
              "sha256Checksum": os.environ["M_SHA256"],
              "releaseNotes": notes,
              "isMandatory": os.environ.get("M_MANDATORY", "false").lower() == "true",
              "minSupportedVersionCode": int(os.environ.get("M_MIN_CODE") or "1"),
              "updatesEnabled": True
          }
          print(json.dumps(manifest, indent=2))
          PY
          cat dist/update-manifest.json
        env:
          M_VER_NAME: ${{ steps.meta.outputs.version_name }}
          M_VER_CODE: ${{ steps.meta.outputs.version_code }}
          M_APK_URL: ${{ steps.meta.outputs.apk_download_url }}
          M_NOTES: ${{ inputs.release_notes }}
          M_MANDATORY: ${{ inputs.is_mandatory }}
          M_MIN_CODE: ${{ inputs.min_supported_version_code }}

      - name: Clean Up Temporary Keystore
        if: always()
        shell: bash
        run: |
          rm -f "${{ runner.temp }}/raw-upload-key.jks" "${{ runner.temp }}/golocal-upload-key.jks"

      - name: Upload Signed APK & Manifest to GitHub Release
        if: steps.validate_secrets.outputs.has_secrets == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: "GoLocal v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }})"
          body: |
            ### GoLocal Android Release v${{ steps.meta.outputs.version_name }}
            - **Package ID:** `com.aistudio.golocal.wbmxrq`
            - **Version Code:** `${{ steps.meta.outputs.version_code }}`
            - **APK SHA-256:** `${{ steps.checksum.outputs.sha256 }}`
            - **Mandatory Update:** `${{ inputs.is_mandatory }}`
            - **Release Notes:** ${{ inputs.release_notes || 'Automated production build.' }}
          files: |
            dist/${{ steps.meta.outputs.apk_filename }}
            dist/${{ steps.meta.outputs.apk_filename }}.sha256
            dist/SHA256SUMS.txt
            dist/update-manifest.json

      - name: Upload Build Logs & Test Reports
        if: always() && steps.validate_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: golocal-build-logs-run-${{ github.run_number }}
          retention-days: 30
          path: |
            build-logs/
            app/build/reports/tests/
            dist/update-manifest.json
            dist/SHA256SUMS.txt

      - name: Notify Administrator (GitHub Job Summary + Webhook + Optional Email)
        if: always() && steps.validate_secrets.outputs.has_secrets == 'true'
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          ADMIN_WEBHOOK_URL: ${{ secrets.ADMIN_WEBHOOK_URL }}
          VER_NAME: ${{ steps.meta.outputs.version_name }}
          VER_CODE: ${{ steps.meta.outputs.version_code }}
          SHA256: ${{ steps.checksum.outputs.sha256 }}
          REL_TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## GoLocal Android APK Build Report: **${JOB_STATUS^^}**"
            echo "- **Version:** \`v${VER_NAME}\` (versionCode \`${VER_CODE}\`)"
            echo "- **Release Tag:** \`${REL_TAG}\`"
            echo "- **SHA-256:** \`${SHA256:-unavailable}\`"
            echo "- **Workflow Run:** ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$ADMIN_WEBHOOK_URL" ]; then
            PAYLOAD=$(RUN_URL="$RUN_URL" python3 -c 'import json, os; print(json.dumps({"text": f"GoLocal APK Build {os.environ[\"JOB_STATUS\"].upper()}: v{os.environ[\"VER_NAME\"]} (build {os.environ[\"VER_CODE\"]}) SHA256={os.environ.get(\"SHA256\",\"N/A\")} -> {os.environ[\"RUN_URL\"]}"}))')
            curl -fsS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$ADMIN_WEBHOOK_URL" || true
          fi

      - name: Email Administrator Notification (If SMTP Secrets Configured)
        if: always() && steps.validate_secrets.outputs.has_secrets == 'true' && secrets.SMTP_SERVER != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || '465' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[GoLocal CI] APK Build ${{ job.status }} - v${{ steps.meta.outputs.version_name }} (${{ steps.meta.outputs.version_code }})"
          to: ${{ secrets.ADMIN_NOTIFY_EMAIL || 'renukadas083@gmail.com' }}
          from: "GoLocal Build Bot <${{ secrets.SMTP_USERNAME }}>"
          body: |
            GoLocal Android APK build status: ${{ job.status }}
            Package ID: com.aistudio.golocal.wbmxrq
            Version: v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }})
            SHA-256: ${{ steps.checksum.outputs.sha256 }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
