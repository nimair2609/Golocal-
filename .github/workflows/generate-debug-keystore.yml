name: Generate GoLocal Debug Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate Permanent Debug Keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Permanent Android Debug Keystore
        shell: bash
        run: |
          OUT_DIR="${{ runner.temp }}/golocal-keystore"
          mkdir -p "$OUT_DIR"
          KEYSTORE_FILE="$OUT_DIR/debug.keystore"
          BASE64_FILE="$OUT_DIR/debug.keystore.base64.txt"

          keytool -genkeypair \
            -keystore "$KEYSTORE_FILE" \
            -storetype PKCS12 \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=GoLocal Debug, OU=Mobile, O=GoLocal, L=Kolkata, ST=West Bengal, C=IN"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Failed to generate debug.keystore."
            exit 1
          fi

          base64 -w 0 "$KEYSTORE_FILE" > "$BASE64_FILE"

          if [ ! -s "$BASE64_FILE" ]; then
            echo "::error::Failed to Base64-encode debug.keystore."
            exit 1
          fi

          echo "Generated debug.keystore and debug.keystore.base64.txt successfully."

      - name: Verify Keystore & Base64 Round-Trip
        shell: bash
        run: |
          OUT_DIR="${{ runner.temp }}/golocal-keystore"
          KEYSTORE_FILE="$OUT_DIR/debug.keystore"
          BASE64_FILE="$OUT_DIR/debug.keystore.base64.txt"
          DECODED_TEST="${{ runner.temp }}/debug.keystore.verify"

          base64 --decode "$BASE64_FILE" > "$DECODED_TEST"
          cmp -s "$KEYSTORE_FILE" "$DECODED_TEST"
          rm -f "$DECODED_TEST"

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass android \
            -alias androiddebugkey

          echo "Keystore alias 'androiddebugkey' and Base64 round-trip verified."

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## GoLocal Permanent Debug Keystore Generated"
              echo ""
              echo "Download the **GoLocal-Permanent-Debug-Keystore** artifact from this workflow run."
              echo ""
              echo "### Next Steps"
              echo "1. Extract the downloaded artifact ZIP."
              echo "2. Open \`debug.keystore.base64.txt\` and copy its full single-line contents."
              echo "3. Open **GitHub Repository -> Settings -> Secrets and variables -> Actions -> New repository secret**."
              echo "4. Create secret \`ANDROID_DEBUG_KEYSTORE_BASE64\` and paste the copied Base64 text."
              echo "5. Keep \`debug.keystore\` backed up privately. Do not commit it to Git."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Permanent Debug Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoLocal-Permanent-Debug-Keystore
          path: |
            ${{ runner.temp }}/golocal-keystore/debug.keystore
            ${{ runner.temp }}/golocal-keystore/debug.keystore.base64.txt
          retention-days: 7
          if-no-files-found: error
