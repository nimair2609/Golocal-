
name: GoLocal Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_debug_apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK Base
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install & Verify Android SDK Packages
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR" ]; then
            echo "::error::Android SDK directory not found."
            exit 1
          fi

          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable not found."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          set -o pipefail

          SDK_CATALOG_FILE=$(mktemp)
          trap 'rm -f "$SDK_CATALOG_FILE"' EXIT
          "$SDKMANAGER" --list > "$SDK_CATALOG_FILE" 2>/dev/null || true

          echo "Installing platform-tools..."
          "$SDKMANAGER" "platform-tools"

          if grep -qE '^\s*build-tools;36\.0\.0(\s|\|)' "$SDK_CATALOG_FILE"; then
            "$SDKMANAGER" "build-tools;36.0.0"
          else
            LATEST_BT36=$(grep -oE 'build-tools;36\.[0-9]+\.[0-9]+' "$SDK_CATALOG_FILE" | sort -V | tail -n 1 || true)
            if [ -n "$LATEST_BT36" ]; then
              "$SDKMANAGER" "$LATEST_BT36"
            else
              "$SDKMANAGER" "build-tools;36.0.0"
            fi
          fi

          if grep -qE '^\s*platforms;android-36(\s|\|)' "$SDK_CATALOG_FILE"; then
            "$SDKMANAGER" "platforms;android-36"
          else
            "$SDKMANAGER" "platforms;android-36" || true
          fi

          if grep -qE '^\s*platforms;android-36\.1(\s|\|)' "$SDK_CATALOG_FILE"; then
            "$SDKMANAGER" "platforms;android-36.1"
          else
            "$SDKMANAGER" "platforms;android-36.1" || true
          fi

          if [ ! -d "$SDK_DIR/platform-tools" ]; then
            echo "::error::Missing platform-tools."
            exit 1
          fi

          if [ ! -d "$SDK_DIR/platforms/android-36" ] && [ ! -d "$SDK_DIR/platforms/android-36.1" ]; then
            echo "::error::Android API 36 platform not installed."
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1 || true)

          if [ -z "$BUILD_TOOLS_DIR" ] || [ ! -x "$BUILD_TOOLS_DIR/apksigner" ] || [ ! -x "$BUILD_TOOLS_DIR/aapt2" ]; then
            echo "::error::Valid Android build-tools not found."
            exit 1
          fi

          if [ ! -d "$SDK_DIR/licenses" ]; then
            echo "::error::Android SDK licenses directory missing."
            exit 1
          fi

          echo "Android SDK installation verified."

      - name: Set up Gradle (9.3.1 for AGP 9.1.1)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore & Validate Firebase Configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os, sys

          gs_path = "app/google-services.json"

          if not os.path.isfile(gs_path):
              b64_val = os.environ.get("GOOGLE_SERVICES_JSON_BASE64", "").strip()
              if not b64_val:
                  print("::error::Firebase configuration missing.")
                  sys.exit(1)

              try:
                  decoded = base64.b64decode("".join(b64_val.split()), validate=True)
              except Exception:
                  print("::error::Invalid Firebase base64 secret.")
                  sys.exit(1)

              os.makedirs(os.path.dirname(gs_path), exist_ok=True)
              with open(gs_path, "wb") as f:
                  f.write(decoded)

              print("Firebase configuration restored.")
          else:
              print("Using Firebase configuration from repository.")

          try:
              with open(gs_path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              print("::error::Invalid google-services.json.")
              sys.exit(1)

          project_id = str(data.get("project_info", {}).get("project_id", "")).strip()

          if not project_id or project_id == "remixed-project-id":
              print("::error::Invalid Firebase project ID.")
              sys.exit(1)

          expected_pkg = "com.aistudio.golocal.wbmxrq"

          matching_clients = [
              c for c in data.get("client", [])
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == expected_pkg
          ]

          if not matching_clients:
              print(f"::error::Package ID mismatch: {expected_pkg}")
              sys.exit(1)

          oauth_clients = matching_clients[0].get("oauth_client", [])
          has_web_client = any(oc.get("client_type") == 3 for oc in oauth_clients)

          print(f"Firebase project validated: {project_id}")
          print(f"Android package validated: {expected_pkg}")
          print(f"Web OAuth client present: {has_web_client}")

          if not has_web_client:
              print("::warning::Web OAuth client missing. Google Sign-In may not work.")
          PY

      # Restore the stable project debug keystore so SHA-1/SHA-256 remain consistent
      # with Firebase Console & app/google-services.json for Google Sign-In.
      - name: Restore & Verify Stable Debug Keystore
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, sys

          ks_path = "debug.keystore"
          secret_b64 = os.environ.get("ANDROID_DEBUG_KEYSTORE_BASE64", "").strip()
          repo_b64_path = "debug.keystore.base64"

          if secret_b64:
              try:
                  raw = base64.b64decode("".join(secret_b64.split()), validate=True)
              except Exception:
                  print("::error::ANDROID_DEBUG_KEYSTORE_BASE64 secret is not valid Base64.")
                  sys.exit(1)
              with open(ks_path, "wb") as f:
                  f.write(raw)
              print("Restored debug.keystore from ANDROID_DEBUG_KEYSTORE_BASE64 secret.")
          elif os.path.isfile(repo_b64_path):
              with open(repo_b64_path, "r", encoding="utf-8") as f:
                  repo_b64 = "".join(f.read().split())
              try:
                  raw = base64.b64decode(repo_b64, validate=True)
              except Exception:
                  print("::error::Committed debug.keystore.base64 is not valid Base64.")
                  sys.exit(1)
              with open(ks_path, "wb") as f:
                  f.write(raw)
              print("Restored debug.keystore from committed debug.keystore.base64.")
          elif os.path.isfile(ks_path):
              print("Using existing debug.keystore from repository.")
          else:
              print("::error::Neither ANDROID_DEBUG_KEYSTORE_BASE64 secret nor debug.keystore.base64 / debug.keystore is present.")
              print("::error::Refusing to generate an ephemeral keystore because Google Sign-In requires a stable registered SHA-1.")
              sys.exit(1)

          if os.path.getsize(ks_path) == 0:
              print("::error::Restored debug.keystore is empty.")
              sys.exit(1)
          PY

          keytool -list \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey

      - name: Build Android Debug APK
        shell: bash
        run: |
          if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
            echo "Using committed Gradle wrapper."
          else
            GRADLE_CMD="gradle"
            echo "Using Gradle 9.3.1."
          fi

          "$GRADLE_CMD" :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK & Extract Certificate Fingerprints
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          ls -lh "$APK_PATH"

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS_DIR=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1 || true)

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "::error::Android build-tools missing."
            exit 1
          fi

          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          PKG_INFO=$("$AAPT2" dump badging "$APK_PATH" | grep "^package:" || true)
          echo "$PKG_INFO"

          if [[ "$PKG_INFO" != *"name='com.aistudio.golocal.wbmxrq'"* ]]; then
            echo "::error::Unexpected package name."
            exit 1
          fi

          "$APKSIGNER" verify "$APK_PATH"
          echo "APK signature verified."

          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH")

          CERT_OUTPUT="$CERT_OUTPUT" python3 - <<'PY'
          import json, os, re, sys

          cert_out = os.environ["CERT_OUTPUT"]

          sha1_match = re.search(r"SHA-1 digest:\s*([0-9a-fA-F]{40})", cert_out)
          sha256_match = re.search(r"SHA-256 digest:\s*([0-9a-fA-F]{64})", cert_out)

          if not sha1_match or not sha256_match:
              print("::error::Failed to extract certificate fingerprints.")
              sys.exit(1)

          sha1_raw = sha1_match.group(1).lower()
          sha256_raw = sha256_match.group(1).lower()

          fmt = lambda h: ":".join(h[i:i+2].upper() for i in range(0, len(h), 2))

          sha1_colon = fmt(sha1_raw)
          sha256_colon = fmt(sha256_raw)

          with open("app/google-services.json", "r", encoding="utf-8") as f:
              gs = json.load(f)

          project_id = gs.get("project_info", {}).get("project_id", "unknown")
          pkg = "com.aistudio.golocal.wbmxrq"

          registered_sha1s = [
              oc.get("android_info", {}).get("certificate_hash", "").lower()
              for c in gs.get("client", [])
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == pkg
              for oc in c.get("oauth_client", [])
              if oc.get("client_type") == 1
          ]

          sha1_in_gs = sha1_raw in registered_sha1s

          print(f"Debug Certificate SHA-1: {sha1_colon}")
          print(f"Debug Certificate SHA-256: {sha256_colon}")
          print(f"SHA-1 present in google-services.json: {sha1_in_gs}")

          if not sha1_in_gs:
              print("::warning::Built APK SHA-1 is NOT present in app/google-services.json; Google Sign-In will fail with DEVELOPER_ERROR (10) until registered in Firebase Console and google-services.json is updated.")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as s:
                  s.write("## GoLocal Android Debug APK Build Summary\n\n")
                  s.write("| Property | Value |\n")
                  s.write("|---|---|\n")
                  s.write(f"| **Android Package ID** | `{pkg}` |\n")
                  s.write(f"| **Firebase Project ID** | `{project_id}` |\n")
                  s.write(f"| **Debug SHA-1** | `{sha1_colon}` |\n")
                  s.write(f"| **Debug SHA-256** | `{sha256_colon}` |\n")
                  s.write(f"| **SHA-1 registered in Firebase config** | `{'Yes' if sha1_in_gs else 'No'}` |\n")
                  s.write("\n> Debug signing key is not a production release key.\n")
          PY

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoLocal-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
