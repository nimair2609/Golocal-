name: GoLocal Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_debug_apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (9.3.1 for AGP 9.1.1)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore Project Debug Keystore
        shell: bash
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 --decode debug.keystore.base64 > debug.keystore
              echo "Restored debug.keystore from debug.keystore.base64."
            else
              echo "::error::Neither debug.keystore nor debug.keystore.base64 exists in the repository."
              exit 1
            fi
          fi

      - name: Build Android Debug APK
        shell: bash
        run: |
          if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
            echo "Using committed Gradle wrapper."
          else
            GRADLE_CMD="gradle"
            echo "Gradle wrapper jar not committed; using Gradle 9.3.1 from setup-gradle."
          fi

          "$GRADLE_CMD" :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Generated Debug APK
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Debug APK was not generated at $APK_PATH"
            exit 1
          fi

          ls -lh "$APK_PATH"

          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" | sort -V | tail -n 1 || true)
            if [ -n "$AAPT2" ]; then
              PKG_INFO=$("$AAPT2" dump badging "$APK_PATH" | grep "^package:" || true)
              echo "$PKG_INFO"
              if [[ "$PKG_INFO" != *"name='com.aistudio.golocal.wbmxrq'"* ]]; then
                echo "::error::Unexpected package name in Debug APK."
                exit 1
              fi
            fi

            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1 || true)
            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify "$APK_PATH"
              echo "Debug APK signature verified."
            fi
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoLocal-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
