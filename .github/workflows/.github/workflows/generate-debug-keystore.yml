
name: Generate GoLocal Debug Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate permanent debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore golocal-debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=GoLocal, OU=NR Next, O=NR Group, L=India, C=IN"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoLocal-Permanent-Debug-Keystore
          path: golocal-debug.keystore
          retention-days: 7
